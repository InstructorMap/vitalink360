<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceso de socios | VITALINK 360</title><link rel="stylesheet" href="./admin.css"><style>main{max-width:470px;margin:8vh auto;padding:20px}.panel{background:#123448;border:1px solid #31586b;border-radius:18px;padding:25px}label{display:block;margin:14px 0}input{display:block;width:100%;box-sizing:border-box;margin-top:6px}#msg{min-height:28px}</style></head><body><header class="admin-top"><a class="admin-brand" href="./index.html"><img src="./assets/vitalink-mark.svg" width="42" height="42" alt=""><span><strong>VITALINK <em>360</em></strong><small>PORTAL DEL SOCIO</small></span></a></header><main><section class="panel"><h1>Ingresar al portal</h1><p>¿Todavía no tenés cuenta? <a href="./registro.html">Registrate como socio</a>. Tu solicitud quedará pendiente de aprobación.</p><form id="login"><label>Correo<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" id="submit">Ingresar</button></form><p id="msg" role="status"></p><p>Para emergencias reales utilizá los canales telefónicos habituales. Este portal no despacha ambulancias.</p></section></main><script src="./modules/auth-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./modules/auth.js"></script><script>(()=>{const form=document.querySelector('#login'),msg=document.querySelector('#msg'),btn=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Validando…';const f=new FormData(form);try{await VitalinkAuth.signIn(String(f.get('email')),String(f.get('password')));const id=await VitalinkAuth.getIdentity();if(!id){await VitalinkAuth.signOut();throw Error('Cuenta sin habilitación VITALINK')}location.assign('./portal.html')}catch(err){msg.textContent=err.message}finally{btn.disabled=false}})})();</script></body></html>
