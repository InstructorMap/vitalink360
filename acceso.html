<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceso seguro | VITALINK 360</title><link rel="stylesheet" href="./admin.css?v=1"><style>.auth-shell{max-width:480px;margin:7vh auto;padding:20px}.auth-card{background:#123448;border:1px solid #31586b;border-radius:20px;padding:28px}.auth-card h1{font-size:29px}.auth-card label{display:block;font-size:13px;margin:16px 0}.auth-card input{display:block;margin-top:8px}.auth-card p{color:#b6ced8;line-height:1.6;font-size:13px}.auth-card .primary{margin-top:15px}.auth-msg{min-height:36px;color:#ffcf9e}</style></head><body><header class="admin-top"><a class="admin-brand" href="./index.html"><img src="./assets/vitalink-mark.svg" width="42" height="42" alt=""><span><strong>VITALINK <em>360</em></strong><small>CONTROL DE ACCESO</small></span></a><nav><a href="./central.html">Central demo</a></nav></header><main class="auth-shell"><section class="auth-card"><span class="eyebrow">SEGURIDAD · VITALINK 360</span><h1>Acceso de personal</h1><p>Acceso exclusivo para personal autorizado de VITALINK 360. Las cuentas requieren habilitación individual; los permisos se verifican en el servidor.</p><form id="login"><label>Correo institucional<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" id="submit" type="submit">Ingresar</button></form><p id="message" class="auth-msg" role="status"></p><a href="./admin.html">Ir al panel ficticio de demostración</a></section></main><script src="./modules/auth-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./modules/auth.js"></script><script>(()=>{const auth=window.VitalinkAuth,form=document.getElementById('login'),msg=document.getElementById('message'),button=document.getElementById('submit');if(!auth.enabled){msg.textContent='Acceso temporalmente no disponible. Intentá nuevamente más tarde.';button.disabled=true;return}form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;msg.textContent='Verificando acceso…';const d=new FormData(form);try{await auth.signIn(String(d.get('email')),String(d.get('password')));const identity=await auth.getIdentity();if(!identity||!['admin','operador'].includes(identity.role)){await auth.signOut();throw Error('Tu cuenta no tiene permisos para acceder al panel de personal.')}location.assign('./gestion.html')}catch(err){msg.textContent=err.message}finally{button.disabled=false}})})();</script></body></html>
