<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Crear cuenta de socio | VITALINK 360</title><link rel="stylesheet" href="./admin.css"><style>main{max-width:540px;margin:5vh auto;padding:20px}.panel{background:#123448;border:1px solid #31586b;border-radius:18px;padding:24px}label{display:block;margin:14px 0}input{display:block;width:100%;box-sizing:border-box;margin-top:6px}p{line-height:1.55}#msg{min-height:45px}[hidden]{display:none!important}</style></head><body><header class="admin-top"><a class="admin-brand" href="./index.html"><img src="./assets/vitalink-mark.svg" width="42" height="42" alt=""><span><strong>VITALINK <em>360</em></strong><small>REGISTRO DE SOCIOS</small></span></a><nav><a href="./portal-acceso.html">Ya tengo cuenta</a></nav></header><main><section class="panel"><h1>Creá tu cuenta</h1><p>Sin UUID ni intervención técnica. El registro crea una solicitud de afiliación <strong>pendiente de aprobación</strong>; no otorga cobertura médica.</p><form id="register"><label>Nombre y apellido<input name="name" required minlength="3" maxlength="120" autocomplete="name"></label><label>Correo electrónico<input name="email" type="email" required autocomplete="email"></label><label>Teléfono de contacto<input name="contact" type="tel" maxlength="120" autocomplete="tel"></label><label>Contraseña<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><button class="primary" id="submit">Crear cuenta</button></form><p id="msg" role="status"></p><button id="complete" class="secondary" hidden>Completar registro después de verificar el correo</button><p><strong>Importante:</strong> esta plataforma está en pruebas. No sirve para solicitar emergencias reales.</p></section></main><script src="./modules/auth-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./modules/registro.js?v=1"></script></body></html>
